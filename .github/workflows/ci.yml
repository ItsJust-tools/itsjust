name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npm run lint --if-present
      - run: npm run typecheck --if-present

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - run: npm test --if-present

  # Verify README links stay valid
  docs-check:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check dead markdown links
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            let errors = 0;
            const mdFiles = fs.readdirSync('.', { recursive: true })
              .filter(f => typeof f === 'string' && f.endsWith('.md'))
              .filter(f => !f.includes('node_modules') && !f.startsWith('node_modules'));
            for (const file of mdFiles) {
              const content = fs.readFileSync(file, 'utf-8');
              const links = [...content.matchAll(/\[([^\]]*)\]\(([^)]+)\)/g)];
              for (const [, , url] of links) {
                if (url.startsWith('http') || url.startsWith('#') || url.startsWith('mailto:')) continue;
                const resolved = path.resolve(path.dirname(file), url.split('#')[0]);
                if (!fs.existsSync(resolved)) {
                  console.error('Dead link in ' + file + ' -> ' + url);
                  errors++;
                }
              }
            }
            if (errors > 0) process.exit(1);
            console.log('✅ All markdown links valid.');
          "

      - name: Check code fence language tags
        run: |
          node -e "
            const fs = require('fs');
            let errors = 0;
            const fence = '\`\`\`';
            const mdFiles = fs.readdirSync('.', { recursive: true })
              .filter(f => typeof f === 'string' && f.endsWith('.md'))
              .filter(f => !f.includes('node_modules') && !f.startsWith('node_modules'));
            for (const file of mdFiles) {
              const content = fs.readFileSync(file, 'utf-8');
              const lines = content.split(/\r?\n/);
              let inBlock = false;
              for (let i = 0; i < lines.length; i++) {
                const trimmed = lines[i].trim();
                if (!trimmed.startsWith(fence)) continue;
                if (!inBlock) {
                  if (trimmed === fence) {
                    console.error(file + ':' + (i + 1) + ' - code fence missing language tag');
                    errors++;
                  }
                  inBlock = true;
                } else {
                  inBlock = false;
                }
              }
            }
            if (errors > 0) process.exit(1);
            console.log('✅ All code fences have language tags.');
          "

  # List repo tools and verify they exist
  tool-audit:
    name: Tool Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify listed repos exist
        run: |
          node -e "
            const known = new Set([
              'blob-generator', 'calculator', 'calendar', 'color-picker',
              'config-converter', 'contrast-checker', 'countdown', 'cron',
              'css-filter-visualizer', 'data-uri-builder', 'diff-viewer',
              'Equation', 'gitignore-generator', 'json-formatter', 'landing',
              'Notepad', 'password-generator', 'qr-code', 'sql-formatter',
              'svg-editor', 'system-config-builder', 'systemd-builder',
              'template', 'vision-deficiency-simulator', 'itsjust', '.github'
            ]);
            const readme = require('fs').readFileSync('README.md', 'utf-8');
            const errors = [];
            for (const repo of known) {
              const url = 'https://github.com/ItsJust-tools/' + repo;
              if (!readme.includes(url)) {
                errors.push('Missing link for: ' + repo);
              }
            }
            if (errors.length > 0) {
              errors.forEach(e => console.error(e));
              process.exit(1);
            }
            console.log('✅ All ' + known.size + ' repos referenced in README.');
          "
