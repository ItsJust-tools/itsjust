# Auto-label configuration for PR Labeler (actions/labeler@v5+ schema)
# See https://github.com/actions/labeler

ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/*'
          - '.github/*'

testing:
  - changed-files:
      - any-glob-to-any-file:
          - '__tests__/**/*'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'package.json'
          - 'package-lock.json'
